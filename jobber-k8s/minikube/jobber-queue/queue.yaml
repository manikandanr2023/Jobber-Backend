apiVersion: apps/v1
kind: Deployment

metadata:
  name: jobber-queue
  namespace: production

spec:
  replicas: 1

  selector:
    matchLabels:
      app: jobber-queue

  template:
    metadata:
      labels:
        app: jobber-queue

    spec:
      containers:
        - name: jobber-queue
          image: rabbitmq:3-management

          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "jobber"

            - name: RABBITMQ_DEFAULT_PASS
              value: "jobberpass"

          resources:
            limits:
              memory: "512Mi"
              cpu: "0.5"

            requests:
              memory: "150Mi"
              cpu: "100m"

          ports:
            - name: queue
              containerPort: 5672
              protocol: TCP

            - name: mgmt
              containerPort: 15672
              protocol: TCP

          volumeMounts:
            - name: rabbitmq-local-storage
              mountPath: /var/lib/rabbitmq

      volumes:
        - name: rabbitmq-local-storage
          persistentVolumeClaim:
            claimName: rabbitmq-pvc