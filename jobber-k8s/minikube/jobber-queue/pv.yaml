apiVersion: v1
kind: PersistentVolume
metadata:
  name: rabbitmq-pv
spec:
  storageClassName: rabbitmq-local-storage
  capacity:
    storage: 0.5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/storage/data1"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-pvc
  namespace: production
spec:
  storageClassName: rabbitmq-local-storage
  resources:
    requests:
      storage: 0.5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce