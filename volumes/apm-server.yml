apm-server:
  host: "apm_server_container:8200"
  
  # Timeout adjustments to prevent HTTP 503 errors on long intake streams
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 45s

  # RUM / CORS configuration fix (Restricts '*' wildcard)
  rum:
    enabled: true
    allow_origins: ['https://app.yourdomain.com'] # Replace with your actual frontend domain(s)

auth:
  secret_token: ''

# Internal memory queue to buffer intake spikes
queue.mem:
  events: 4096
  flush.min_events: 2048
  flush.timeout: 1s

output.elasticsearch:
  hosts: ['http://elasticsearch_container:9200']
  enabled: true
  protocol: "http"
  username: "elastic"
  password: "admin1234"
  ssl.enabled: false
  
  # Downstream worker tuning to clear queues faster
  worker: 4
  max_retries: 5
  bulk_max_size: 1000

monitoring.enabled: true

monitoring.elasticsearch:
  protocol: "http"
  username: "elastic"
  password: "admin1234"
  hosts: ['http://elasticsearch_container:9200']