#docker compose up -d redis  mySql postgres rabbitmq elasticsearch kibana metricbeat heartbeat
services:
  jenkins:
    container_name: jenkins_container
    image: jenkins/jenkins:lts
    privileged: true
    user: root
    ports:
      - 8080:8080
      - 50000:50000
    volumes:
      - ./docker-volumes/jenkins_compose/jenkins_configuration:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock


  redis:
    image: redis:7.4
    container_name: redis_service
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --loglevel warning
    volumes:
      - ./docker-volumes/redis:/data

  metricbeat:
    container_name: metricbeat_container
    image: docker.elastic.co/beats/metricbeat:9.5.2
    user: root

    ports:
      - "5066:5066"

    networks:
      - elastic

    volumes:
      - ./metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /proc:/hostfs/proc:ro
      - /:/hostfs:ro

    command: ["run", "--strict.perms=false", "--system.hostfs=/hostfs"]

    depends_on:
      - elasticsearch


  heartbeat:
      container_name: heartbeat_container
      image: docker.elastic.co/beats/heartbeat:9.5.2
      user: root
      hostname: heartbeat
      cap_add:
        -  NET_RAW
      networks:
        - elastic
      command: ["-e", "-c", "/usr/share/heartbeat/heartbeat.yml", "run", "--strict.perms=false"]
      volumes:
        - ./heartbeat.yml:/usr/share/heartbeat/heartbeat.yml:ro
      depends_on:
        - elasticsearch
  mongodb:
    image: mongo:8.0
    container_name: mongodb_container
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - ./docker-volumes/mongodb:/data/db


  mysql:
    image: mysql:8.4
    container_name: mysql_container
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: api
      MYSQL_USER: jobber
      MYSQL_PASSWORD: api
      MYSQL_DATABASE: jobber_auth
    volumes:
      - ./docker-volumes/mysql:/var/lib/mysql



  apmServer:
    image: docker.elastic.co/apm/apm-server:9.5.2
    container_name: apm_server_container

    ports:
      - "8200:8200"

    networks:
      - elastic

    command: >
      -e
      -E apm-server.host=0.0.0.0:8200
      -E apm-server.rum.enabled=true
      -E output.elasticsearch.hosts=["http://elasticsearch_container:9200"]
      -E output.elasticsearch.username=elastic
      -E output.elasticsearch.password=admin1234
      -E setup.kibana.host=http://kibana_container:5601
      -E setup.kibana.username=elastic
      -E setup.kibana.password=admin1234
      -E setup.template.settings.index.number_of_replicas=0
      -E apm-server.kibana.enabled=true
      -E apm-server.kibana.host=http://kibana_container:5601
      -E apm-server.kibana.username=elastic
      -E apm-server.kibana.password=admin1234
      -E strict.perms=false
      -E apm-server.auth.anonymous.enabled=true

  postgres:
    image: postgres:17
    container_name: postgres_container
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: jobber
      POSTGRES_PASSWORD: api
      POSTGRES_DB: jobber_reviews
    volumes:
      - ./docker-volumes/postgres:/var/lib/postgresql/data


  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_container
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=jobber
      - RABBITMQ_DEFAULT_PASS=jobberpass
    ports:
      - "5672:5672"
      - "15672:15672"




  elasticsearch:
    container_name: elasticsearch_container
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
    restart: always
    environment:
      ES_JAVA_OPTS: -Xmx1g -Xms1g
      bootstrap.memory_lock: "true"
      discovery.type: single-node
      network.host: 0.0.0.0
      transport.host: 127.0.0.1
      http.host: 0.0.0.0
      xpack.security.enabled: "true"
      xpack.security.authc.api_key.enabled: "true"
      xpack.monitoring.collection.enabled: "true"
      xpack.security.enrollment.enabled: "true"
      xpack.security.authc.token.enabled: "true"
      ELASTIC_PASSWORD: admin1234
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./docker-volumes/elasticsearch:/usr/share/elasticsearch/data
    networks:
      - elastic


  kibana:
    container_name: kibana_container
    image: docker.elastic.co/kibana/kibana:9.5.2
    restart: always
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=["http://elasticsearch_container:9200"]
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=kibana
      - ELASTICSEARCH_SERVICEACCOUNT_TOKEN=AAEAAWVsYXN0aWMva2liYW5hL2pvYmJlci1raWJhbmE6c3F4QzdnUjBTNlM3Rkl0OXVkTjh2UQ
    depends_on:
      - elasticsearch
    networks:
      - elastic
    volumes:
      - ./kibana.yml/:/usr/share/kibana/config/kibana.yml:ro


